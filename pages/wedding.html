<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MJ Event Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --obsidian: #08090a;
            --obsidian-light: #101214;
            --graphite: #17191c;
            --graphite-light: #24272b;
            --tungsten: #30343a;
            --tungsten-light: #41464d;
            --steel: #58616a;
            --steel-light: #77818b;
            --titanium: #aeb5bb;
            --titanium-light: #d3d7da;
            --chromium: #f1f3f4;
            --chromium-bright: #ffffff;
            --metal-border: #687078;
            --shadow-dark: rgba(0, 0, 0, 0.65);
            --shadow-light: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #292d32 0%,
                    #17191c 35%,
                    #08090a 100%
                );
            color: var(--chromium);
            min-height: 100vh;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--obsidian);
        }

        ::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    180deg,
                    var(--chromium),
                    var(--steel),
                    var(--graphite)
                );
            border-radius: 10px;
            border: 2px solid var(--obsidian);
        }

        ::-webkit-scrollbar-thumb:hover {
            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    var(--titanium),
                    var(--steel)
                );
        }

        .navbar {
            width: 100%;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 6%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background:
                linear-gradient(
                    135deg,
                    rgba(8, 9, 10, 0.98),
                    rgba(36, 39, 43, 0.97),
                    rgba(8, 9, 10, 0.98)
                );
            border-bottom: 1px solid var(--steel);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .head {
            display: flex;
            align-items: center;
        }

        .head a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .head img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            display: block;
            margin-right: 12px;
            border-radius: 50%;
            border: 1px solid var(--metal-border);
            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #aeb5bb,
                    #41464d
                );
            padding: 3px;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.65),
                0 0 10px rgba(255, 255, 255, 0.08);
            transition:
                transform 0.3s ease,
                filter 0.3s ease,
                box-shadow 0.3s ease;
        }

        .head img:hover {
            transform: scale(1.08);
            filter: brightness(1.15);
            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(255, 255, 255, 0.2);
        }

        .navlink {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .navlink a {
            text-decoration: none;
            color: var(--titanium-light);
            font-size: 17px;
            font-weight: 500;
            position: relative;
            transition:
                color 0.3s ease,
                text-shadow 0.3s ease;
        }

        .navlink a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            left: 50%;
            bottom: -7px;
            transform: translateX(-50%);
            background:
                linear-gradient(
                    90deg,
                    var(--steel),
                    var(--chromium),
                    var(--steel)
                );
            transition: width 0.3s ease;
        }

        .navlink a:hover {
            color: var(--chromium-bright);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .navlink a:hover::after {
            width: 100%;
        }

        .gallery-hero {
            min-height: 440px;
            padding: 150px 20px 70px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    #30343a 0%,
                    #17191c 45%,
                    #08090a 100%
                );
        }

        .gallery-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.03),
                    transparent 35%,
                    rgba(255,255,255,0.02)
                );
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            max-width: 850px;
            z-index: 2;
        }

        .hero-content h2 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(48px, 7vw, 82px);
            line-height: 1.1;
            margin-bottom: 15px;
            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #aeb5bb 30%,
                    #ffffff 50%,
                    #6f7880 70%,
                    #ffffff 100%
                );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .hero-content p {
            color: var(--titanium);
            font-size: 17px;
            line-height: 1.7;
            max-width: 700px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            padding: 65px 20px 30px;
            background:
                linear-gradient(
                    180deg,
                    var(--graphite),
                    var(--obsidian)
                );
        }

        .section-title h3 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(38px, 5vw, 55px);
            color: var(--chromium);
            display: inline-block;
            position: relative;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
        }

        .section-title h3::after {
            content: "";
            display: block;
            width: 90px;
            height: 3px;
            margin: 12px auto 0;
            border-radius: 10px;
            background:
                linear-gradient(
                    90deg,
                    var(--graphite),
                    var(--chromium),
                    var(--steel),
                    var(--chromium),
                    var(--graphite)
                );
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
        }

        .album-section {
            width: min(1150px, calc(100% - 40px));
            margin: 0 auto 70px;
            padding: 35px;
            background: rgba(23,25,28,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--metal-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .album-card {
            display: block;
            position: relative;
            height: 300px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            background: var(--obsidian);
            border: 1px solid var(--metal-border);
            border-radius: 10px;
            box-shadow: 0 7px 18px rgba(0,0,0,0.55);
            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }

        .album-card:hover {
            transform: translateY(-7px);
            border-color: var(--chromium);
            box-shadow:
                0 12px 30px rgba(0,0,0,0.75),
                0 0 18px rgba(255,255,255,0.08);
        }

        .album-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter:
                grayscale(30%)
                contrast(110%)
                brightness(65%);
            transition:
                transform 0.6s ease,
                filter 0.6s ease;
        }

        .album-card:hover img {
            transform: scale(1.08);
            filter:
                grayscale(5%)
                contrast(110%)
                brightness(78%);
        }

        .album-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to top,
                    rgba(8,9,10,0.98) 0%,
                    rgba(8,9,10,0.55) 38%,
                    rgba(8,9,10,0.05) 75%
                );
            z-index: 1;
            pointer-events: none;
        }

        .album-info {
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 20px;
            z-index: 2;
        }

        .album-info h4 {
            font-family: 'Dancing Script', cursive;
            font-size: 34px;
            margin-bottom: 5px;
            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #aeb5bb,
                    #ffffff
                );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .album-info p {
            color: var(--titanium-light);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .album-count {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 12px;
            font-size: 12px;
            color: var(--chromium);
            background: rgba(8,9,10,0.65);
            border: 1px solid var(--steel);
            border-radius: 4px;
            transition:
                background 0.3s ease,
                border-color 0.3s ease;
        }

        .album-card:hover .album-count {
            background: rgba(255,255,255,0.1);
            border-color: var(--chromium);
        }

        footer {
            padding: 25px 20px;
            text-align: center;
            background: var(--obsidian);
            border-top: 1px solid var(--tungsten-light);
        }

        footer p {
            color: var(--steel-light);
            font-size: 13px;
        }

        .hamburger {
            display: none;
            color: var(--titanium-light);
            font-size: 30px;
            cursor: pointer;
            user-select: none;
        }

        @media screen and (max-width: 900px) {
            .album-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media screen and (max-width: 768px) {
            .navbar {
                padding: 10px 5%;
            }

            .head img {
                width: 50px;
                height: 50px;
            }

            .navlink {
                display: none;
                position: absolute;
                top: 75px;
                left: 0;
                width: 100%;
                padding: 20px;
                flex-direction: column;
                gap: 20px;
                background: rgba(8,9,10,0.98);
                border-bottom: 1px solid var(--steel);
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            }

            .navlink.active {
                display: flex;
            }

            .hamburger {
                display: block;
            }

            .gallery-hero {
                min-height: 400px;
                padding-top: 120px;
            }

            .album-section {
                width: calc(100% - 24px);
                padding: 20px;
                border-radius: 16px;
            }

            .album-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .album-card {
                height: 260px;
            }

            .album-info h4 {
                font-size: 32px;
            }
        }

        @media screen and (max-width: 450px) {
            .hero-content h2 {
                font-size: 48px;
            }

            .hero-content p {
                font-size: 14px;
            }

            .album-info h4 {
                font-size: 30px;
            }

            .album-card {
                height: 230px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="head">
            <a href="../index.html">
                <img src="../assets/images/site/logo.jpg" alt="Jody SV Logo">
            </a>
        </div>

        <div
            class="hamburger"
            id="menuButton"
            onclick="toggleMenu()"
            aria-label="Toggle navigation"
            aria-expanded="false"
        >
            ☰
        </div>

        <div class="navlink" id="navLinks">
            <a href="../index.html">Home</a>
            <a href="#albums">Albums</a>
            <a href="#contact">Contact</a>
        </div>

    </nav>

    <section class="gallery-hero">

        <div class="hero-content">

            <h2>Event Gallery</h2>

            <p>
                A collection of unforgettable moments,
                beautifully captured from every
                celebration and special occasion.
            </p>

        </div>

    </section>

    <section class="section-title" id="albums">

        <h3>Albums</h3>

    </section>


    <section class="album-section">

        <div class="album-grid">

            <a href="wedcard.html" class="album-card">

                <img
                    src="../assets/images/wedding/image.png"
                    alt="Wedding Events"
                >

                <div class="album-info">

                    <h4>Elegant Pure White Wedding</h4>

                    <p>
                        Celebrations, parties and special moments.
                    </p>

                    <span class="album-count">
                        View Album
                    </span>

                </div>

            </a>

        </div>

    </section>

    <footer id="contact">

        <p>
            © 2026 Jody SV Event Styling & Catering
        </p>

    </footer>

    <script>
        function toggleMenu() {
            const nav = document.getElementById("navLinks");
            const button = document.getElementById("menuButton");

            nav.classList.toggle("active");

            const isOpen = nav.classList.contains("active");

            button.setAttribute(
                "aria-expanded",
                isOpen ? "true" : "false"
            );

            button.innerHTML = isOpen ? "✕" : "☰";
        }

        document.querySelectorAll(".navlink a").forEach(function(link) {
            link.addEventListener("click", function() {
                const nav = document.getElementById("navLinks");
                const button = document.getElementById("menuButton");

                nav.classList.remove("active");

                button.setAttribute(
                    "aria-expanded",
                    "false"
                );

                button.innerHTML = "☰";
            });
        });
    </script>

</body>
</html>
